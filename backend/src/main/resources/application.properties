spring.application.name=backend

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/lms_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Yangon&characterEncoding=UTF-8
spring.datasource.username=LMS_USER
spring.datasource.password=LMSpasssword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true

#jwt token
jwt.secret=ThisIsMyVeryLongLMSJwtSecretKeyForDevelopmentOnly123456789